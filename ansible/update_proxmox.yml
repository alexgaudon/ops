---
- name: Update Proxmox hosts and reboot if needed (one host at a time)
  hosts: proxmox_hosts
  become: true
  serial: 1
  tasks:
    - name: Remove Proxmox enterprise repository files
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d
        patterns:
          - pve-enterprise.list
          - pve-enterprise.sources
      register: enterprise_repo_files

    - name: Delete Proxmox enterprise repository files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ enterprise_repo_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      notify: update package cache

    - name: Ensure the no-subscription repository is enabled
      block:
        - name: Check if proxmox.sources exists
          ansible.builtin.stat:
            path: /etc/apt/sources.list.d/proxmox.sources
          register: proxmox_sources

        - name: Update proxmox.sources to use the no-subscription repository
          ansible.builtin.blockinfile:
            path: /etc/apt/sources.list.d/proxmox.sources
            marker: "# {mark} ANSIBLE MANAGED BLOCK"
            block: |
              Types: deb
              URIs: http://download.proxmox.com/debian/pve
              Suites: trixie
              Components: pve-no-subscription
            state: present
          when: proxmox_sources.stat.exists
          notify: update package cache

        - name: Create pve-no-subscription.list if proxmox.sources does not exist
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/pve-no-subscription.list
            content: ""
            force: false
            mode: "0644"
          when: not proxmox_sources.stat.exists

        - name: Add the no-subscription repository line
          ansible.builtin.lineinfile:
            path: /etc/apt/sources.list.d/pve-no-subscription.list
            regexp: "^deb.*pve-no-subscription"
            line: "deb http://download.proxmox.com/debian/pve trixie pve-no-subscription"
            state: present
          when: not proxmox_sources.stat.exists
          notify: update package cache

    - name: Disable the Proxmox subscription check
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/99pve-nosubscription
        regexp: '^Acquire::https::proxy::enterprise\.proxmox\.com'
        line: 'Acquire::https::proxy::enterprise.proxmox.com::Verify-Peer "false";'
        state: present
        create: true

    - name: Remove the enterprise subscription key if present
      ansible.builtin.file:
        path: /etc/apt/trusted.gpg.d/proxmox-ve-release-enterprise.gpg
        state: absent

    - name: Update the package cache
      ansible.builtin.apt:
        update_cache: true

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot if required
      ansible.builtin.reboot:
      when: reboot_required.stat.exists

    - name: Verify the result
      when: not ansible_check_mode
      block:
        - name: Verify that the enterprise repository files are absent
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - /etc/apt/sources.list.d/pve-enterprise.list
            - /etc/apt/sources.list.d/pve-enterprise.sources
          register: enterprise_files_check

        - name: Fail if an enterprise repository file remains
          ansible.builtin.assert:
            that:
              - item.stat.exists == false
            fail_msg: "Enterprise repository file {{ item.item }} still exists."
          loop: "{{ enterprise_files_check.results }}"
          loop_control:
            label: "{{ item.item }}"

        - name: Verify that the no-subscription repository is enabled
          ansible.builtin.command:
            cmd: grep -Rhs "pve-no-subscription" /etc/apt/sources.list.d/
          register: no_subscription
          changed_when: false
          failed_when: no_subscription.stdout | length == 0

        - name: Display the verification result
          ansible.builtin.debug:
            msg: "The no-subscription repository is enabled."

  handlers:
    - name: update package cache
      ansible.builtin.apt:
        update_cache: true
