services:
  stock-corn-stats:
    image: ghcr.io/alexgaudon/stock-corn-stats:latest
    container_name: stock-corn-stats
    restart: unless-stopped
    pull_policy: always
    env_file:
      - .env
    labels:
      - com.centurylinklabs.watchtower.enable=true
    security_opt:
      - no-new-privileges:true
