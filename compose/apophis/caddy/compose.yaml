services:
  caddy:
    build: .
    image: caddy-dns:local
    container_name: caddy
    restart: unless-stopped
    ports:
      - "10.0.0.50:80:80/tcp"
      - "10.0.0.50:443:443/tcp"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./conf:/etc/caddy
      - ./data:/data
      - ./config:/config
    networks:
      edge:
        gw_priority: 1
      preview-public-lookup: {}

networks:
  edge:
    name: edge
  preview-public-lookup:
    external: true
