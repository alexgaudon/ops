services:
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # containrrr 1.7.1 predates Docker 29, whose daemon rejects clients
      # older than API 1.40 - pin the client version explicitly
      DOCKER_API_VERSION: "1.44"
      # Only manage containers that opt in via the watchtower.enable label
      WATCHTOWER_LABEL_ENABLE: "true"
      # Leave the independently scoped Tallyo updater alone.
      WATCHTOWER_SCOPE: "none"
      # Daily at 04:00 UTC
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      # Remove superseded images so the disk does not fill
      WATCHTOWER_CLEANUP: "true"
    security_opt:
      - no-new-privileges:true
