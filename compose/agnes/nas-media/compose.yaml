name: nas-media
services:
  bazarr:
    image: lscr.io/linuxserver/bazarr@sha256:7ef0e58216900dbce30b123e0eb65f5cb30e36f126de9474acdd2022fb069c54
    container_name: bazarr
    restart: unless-stopped
    environment:
      PUID: "0"
      PGID: "0"
      TZ: America/St_Johns
    ports:
      - "6767:6767"
    volumes:
      - /mnt/pool/docker/media/bazarr/config:/config
      - /mnt/content/media/movies:/movies
      - /mnt/content/media/tv:/tv

  prowlarr:
    image: lscr.io/linuxserver/prowlarr@sha256:431d7efebcef466e56adaa40a7a2fa2b0e85159a037b8bf465eaadbf0cf5bedf
    container_name: prowlarr
    restart: unless-stopped
    environment:
      PUID: "0"
      PGID: "0"
      TZ: America/St_Johns
    ports:
      - "9696:9696"
    volumes:
      - /mnt/pool/docker/media/prowlarr:/config

  radarr:
    image: lscr.io/linuxserver/radarr@sha256:51a9ac2a9eb47afc833541e5fd6c11b86eb9f810694c22fa2429e3078e9194b2
    container_name: radarr
    restart: unless-stopped
    environment:
      PUID: "0"
      PGID: "0"
      TZ: America/St_Johns
    ports:
      - "7878:7878"
    volumes:
      - /mnt/pool/docker/media/radarr/config:/config
      - /mnt/content/media/movies:/movies
      - /mnt/content/downloads:/downloads

  sonarr:
    image: lscr.io/linuxserver/sonarr@sha256:673dc4609a5672bc8e46069c86ffcea283a86b48d34a6c93d8da8c24a1b87571
    container_name: sonarr
    restart: unless-stopped
    environment:
      PUID: "0"
      PGID: "0"
      TZ: America/St_Johns
    ports:
      - "8989:8989"
    volumes:
      - /mnt/pool/docker/media/sonarr/config:/config:z
      - /mnt/content/media/tv:/tv
      - /mnt/content/downloads:/downloads

  seerr:
    image: ghcr.io/seerr-team/seerr@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
    container_name: seerr
    init: true
    restart: unless-stopped
    environment:
      LOG_LEVEL: debug
      TZ: America/St_Johns
    ports:
      - "5055:5055"
    volumes:
      - /mnt/pool/docker/media/jellyseerr/config:/app/config

  jellystat-db:
    image: postgres@sha256:78a275d4c891f7b3a33d3f1a78eda9f1d744954d9e20122bfdc97cdda25cddaf
    restart: always
    environment:
      POSTGRES_DB: jfstat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - /mnt/pool/docker/media/jsdb/:/var/lib/postgresql/data

  jellystat:
    image: cyfershepard/jellystat@sha256:e61c759ec706da378bc8374e797da1dfd298ab30f804cefd82d192c301a888c7
    restart: always
    depends_on:
      - jellystat-db
    environment:
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "10832:3000"
    volumes:
      - /mnt/pool/docker/media/jsdb/:/app/backend/backup-data
