name: jellyfin-prod
services:
  jellyfin:
    image: jellyfin/jellyfin@sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771
    container_name: jellyfin-prod
    restart: always
    environment:
      JELLYFIN_PublishedServerUrl: https://jellyfin.amgau.com
    ports:
      - "8096:8096"
      - "7359:7359/udp"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - type: bind
        source: /mnt/pool/docker/jellyfin-prod/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/pool/docker/jellyfin-prod/cache
        target: /cache
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/content/media/tv
        target: /tv
        read_only: true
      - type: bind
        source: /mnt/content/media/movies
        target: /movies
        read_only: true
