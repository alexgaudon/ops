services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    user: "1000:1000"
    command:
      - serve
      - --auth-file=/var/lib/ntfy/auth.db
      - --auth-default-access=deny-all
      - --behind-proxy
      - --web-root=disable
      - --upstream-base-url=https://ntfy.sh
      - --base-url=https://ntfy.misery.systems
      - --cache-file=/var/lib/ntfy/cache.db
    expose:
      - "80"
    volumes:
      - ./data:/var/lib/ntfy
    networks:
      - edge
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/v1/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  edge:
    external: true
